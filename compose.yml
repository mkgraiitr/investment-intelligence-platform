services:
  postgres:
    image: postgres:18.4-alpine
    container_name: investment-intelligence-postgres
    environment:
      POSTGRES_DB: investment_intelligence
      POSTGRES_USER: investment
      POSTGRES_PASSWORD: investment
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U investment -d investment_intelligence"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
