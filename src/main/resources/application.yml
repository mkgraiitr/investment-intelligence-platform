spring:
  application:
    name: investment-intelligence-platform
  datasource:
    url: ${APP_DATASOURCE_URL:jdbc:postgresql://localhost:5432/investment_intelligence}
    username: ${APP_DATASOURCE_USERNAME:investment}
    password: ${APP_DATASOURCE_PASSWORD:investment}
  flyway:
    enabled: true
    locations: classpath:db/migration
  thymeleaf:
    cache: false

server:
  port: ${APP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

ai:
  enabled: false
  advisor-chat:
    enabled: false
  output-harness:
    strict-mode: true
